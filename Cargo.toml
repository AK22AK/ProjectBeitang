[package]
name = "robinne"
version = "0.2.2"
edition = "2021"

[dependencies]
# GPUI 框架 - 关键：必须启用 font-kit feature 才能显示文字
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }

# 异步运行时
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "sync", "rt", "time"] }
async-channel = "2.0"

# 数据库
rusqlite = { version = "0.32", features = ["bundled", "chrono", "bundled-full"] }

# 序列化和配置
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# 工具
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
dirs = "5.0"
image = "0.25"
rfd = "0.15"
raw-window-handle = "0.6"
sha2 = "0.10"
tempfile = "3.0"
whoami = "1.5"

# 全局快捷键
global-hotkey = "0.4"
notify-rust = "4.12.0"
chrono-english = "0.1.8"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[build-dependencies]
cc = "1.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSOpenPanel", "NSSavePanel", "NSApplication", "NSWindow", "NSView"] }
objc2-foundation = "0.3"
block2 = "0.6"
