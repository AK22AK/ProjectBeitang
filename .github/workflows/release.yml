name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to rebuild, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Release Metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Check out release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Resolve and validate version
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          version="$(sed -nE 's/^version = "(.*)"/\1/p' Cargo.toml | head -n 1)"

          if [[ -z "${version}" ]]; then
            echo "Failed to resolve version from Cargo.toml" >&2
            exit 1
          fi

          if [[ "v${version}" != "${tag}" ]]; then
            echo "Tag ${tag} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            artifact_name: macos
          - os: windows-latest
            label: Windows
            artifact_name: windows
    steps:
      - name: Check out release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        shell: bash
        run: cargo test --quiet

      - name: Build release binary
        shell: bash
        run: cargo build --release

      - name: Package macOS release
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          ./build_mac_app.sh \
            --version "${{ needs.prepare.outputs.version }}" \
            --output-dir "${RUNNER_TEMP}/release" \
            --skip-build

      - name: Package Windows release
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          ./scripts/package_windows.ps1 `
            -Version "${{ needs.prepare.outputs.version }}" `
            -OutputDir "$env:RUNNER_TEMP/release"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact_name }}
          path: |
            ${{ runner.temp }}/release/*.zip
            ${{ runner.temp }}/release/*.dmg
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.zip ./*.dmg > SHA256SUMS.txt

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          draft: false
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS.txt
